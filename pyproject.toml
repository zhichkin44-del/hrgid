[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norma-hr"
version = "0.1.0"
description = "HRgid — ИИ-помощник HR: ответы по Трудовому кодексу РФ и правилам компании со ссылкой на статью"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pgserver>=0.1.4",
  "sentence-transformers>=3.0",
  "langgraph>=0.2",
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-beautifulsoup4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: требует моделей и локальной БД"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*", "sentence_transformers.*", "pgvector.*", "langgraph.*", "bs4.*", "lxml.*"]
ignore_missing_imports = true
