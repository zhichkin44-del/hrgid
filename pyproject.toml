[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrgid"
version = "0.1.0"
description = "HRgid — ИИ-помощник HR: ответы по Трудовому кодексу РФ и правилам компании со ссылкой на статью"
requires-python = ">=3.12"
dependencies = [
  "redis>=5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pgserver>=0.1.4",
  "sentence-transformers>=3.0",
  "langgraph>=0.2",
  "anthropic>=0.40",
  "httpx>=0.27",
  "natasha>=1.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "aiogram>=3.13",
  "pypdf>=5",
  "python-docx>=1.1",
  "reportlab>=4",
  "openpyxl>=3.1",
  "segno>=1.6",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = ["playwright>=1.45", "pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-beautifulsoup4", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "compose: нужен Docker (docker compose config)",
  "slow: требует моделей и локальной БД",
  "db: нужен PostgreSQL (libpq); на этой Windows блокируется Smart App Control — гоняется в CI",
  "natasha: нужна загрузка моделей natasha — гоняется в CI",
  "browser: нужен Playwright и скачанный браузер (на этой Windows блокируется) — гоняется в CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "segno.*", "playwright.*", "pgserver.*", "sentence_transformers.*", "pgvector.*", "langgraph.*", "natasha.*", "bs4.*", "lxml.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# long Russian interface strings of the panel are not wrapped
"src/hrgid/panel/*.py" = ["E501"]
"scripts/panel_*.py" = ["E501"]
"scripts/run_panel.py" = ["E501"]
"src/hrgid/flow/prompts.py" = ["E501"]
"data/evals/*" = ["E501", "I001"]
