name: install-check

# Follows the README "Option B" steps from a clean runner: Python 3.12, CPU torch,
# editable install with dev extras, then the fast test set on PostgreSQL with pgvector.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:hrgid@localhost:5432/hrgid

jobs:
  install-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: hrgid
          POSTGRES_DB: hrgid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU build of torch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Editable install with dev extras
        run: pip install -e ".[dev]"
      - name: Fast tests (not slow, not browser)
        run: pytest -m "not slow and not browser"
