name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:hrgid@localhost:5432/hrgid

jobs:
  # ruff, mypy --strict, быстрые тесты и тесты на PostgreSQL с pgvector
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: hrgid
          POSTGRES_DB: hrgid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-сборка torch: без гигабайтов CUDA; модели в этом job не скачиваются
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -m "not slow and not browser"

  # Браузерные e2e панели: 6 сценариев §17 в Chromium
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - name: Браузерные тесты (пропуск считается ошибкой)
        run: |
          pytest -m browser -rs | tee e2e.log
          if grep -q "SKIPPED" e2e.log; then echo "::error::браузерные тесты пропущены"; exit 1; fi

  # Ворота качества: набор на записанных ответах. Нет записей (tests/recordings/PENDING) ->
  # шаг пропускается с предупреждением и не падает; изменили промпт без записей -> красное.
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: hrgid
          POSTGRES_DB: hrgid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ворота красные на ухудшенном промпте (Fake-модель, без ключей и сети)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pytest tests/test_quality_gate.py
      - name: Есть ли записи ответов
        id: rec
        run: |
          if [ -f tests/recordings/PENDING ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Ворота качества пропущены::нет первой живой записи (tests/recordings/PENDING); выполните make record"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rec.outputs.pending == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - if: steps.rec.outputs.pending == 'false'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: law-raw-v1
      - if: steps.rec.outputs.pending == 'false'
        name: Закон (data/raw не хранится в репозитории)
        run: '[ -f data/raw/st_1.html ] || python scripts/fetch_tk.py'
      - if: steps.rec.outputs.pending == 'false'
        name: Прогон набора на записанных ответах
        run: python scripts/quality_gate.py

  # Чистый клон -> docker compose up -> всё здоровое -> панель и веб-чат отвечают
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Файл окружения из шаблона (без ключей, модель fake)
        run: cp .env.example .env
      - name: Сборка и запуск
        run: docker compose up -d --build
      - name: Ждём api (первый старт грузит закон и индексирует)
        run: |
          for i in $(seq 1 180); do
            api=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || true)
            [ "$api" = "healthy" ] && exit 0
            init=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$(docker compose ps -aq init)" 2>/dev/null || true)
            case "$init" in
              "exited 0" | "running "* | "created "* | "") ;;
              *) echo "::error::init завершился с ошибкой: $init"; docker compose logs init; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::api не стал healthy за 30 минут"
          exit 1
      - name: Панель и веб-чат отвечают
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/login | grep -qi "<html"
          token=$(docker compose exec -T api cat /var/lib/hrgid/web_invite)
          curl -fsS "http://localhost:8000/c/${token}" | grep -q "HRgid"
          curl -fsS -X POST http://localhost:8000/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"invite\": \"${token}\", \"question\": \"Сколько дней ежегодного отпуска?\"}" | grep -q '"status"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/c/no-such-token)" = "404"
      - name: Остальные сервисы живы (бот и MCP без токена или модуля ждут)
        run: |
          docker compose ps --format '{{.Service}} {{.State}}'
          for s in postgres redis worker bot mcp api; do
            docker compose ps "$s" --format '{{.State}}' | grep -q running
          done
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
