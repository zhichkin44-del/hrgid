# Правила расчётов HRgid R1-R9. Единый источник чисел для src/hrgid/calc.
# Текст ТК РФ сверен с data/raw/st_*.html (КонсультантПлюс, ред. от 25.05.2026, выгрузка 2026-11-18).
# Всё, что взято не из этих файлов, помечено verified: false и «сверить с официальным текстом».
version: 1
checked_on: "2026-11-18"
rules:
  R1:
    title: Отпускные
    formula: "средний дневной = заработок за 12 мес. / (29,3 x полных мес. + 29,3 / дней в мес. x отработанных дней неполных мес.); отпускные = средний дневной x дни; НДФЛ 13 % отдельно"
    article: "ст. 139 ТК РФ; Постановление Правительства РФ от 24.12.2007 N 922"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ч. 4 ст. 139 (делитель 12 и 29,3); п. 10 Положения N 922 (неполные месяцы)"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "29,3 и расчётный период 12 мес. сверены с st_139.html. Формула неполных месяцев (п. 10 Положения N 922) в репозитории отсутствует — сверить с официальным текстом."
    params:
      avg_days_per_month: "29.3"
      ndfl_rate: "0.13"
      max_vacation_days: 56
      pay_before_days: 3
  R2:
    title: Компенсация за неиспользованный отпуск при увольнении
    formula: "компенсация = средний дневной заработок (как в R1, период — 12 мес. до месяца увольнения) x неиспользованные дни; НДФЛ 13 % отдельно"
    article: "ст. 127, 139 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ч. 1 ст. 127; ч. 4 ст. 139"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_127.html и st_139.html."
    params: {}
  R3:
    title: Накопленные дни отпуска на дату
    formula: "дни = годовые дни / 12 x полные месяцы; остаток месяца >= 15 дней считается полным месяцем, меньше — отбрасывается"
    article: "ст. 121, 122 ТК РФ; п. 35 Правил об очередных и дополнительных отпусках (НКТ СССР от 30.04.1930 N 169)"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ст. 122 ч. 2 (право на отпуск через 6 мес.); п. 35 Правил (округление излишка >= половины месяца)"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Ст. 121-122 сверены с st_121.html, st_122.html. Правила N 169 (п. 35) в репозитории нет — правило «>= 15 дней» взято из ТЗ, сверить с официальным текстом."
    params:
      annual_days: "28"
      round_up_from_days: 15
  R4:
    title: Сверхурочные
    formula: "ставка = оклад / норма часов месяца; в пределах 120 ч в год: первые 2 ч дня x 1,5, далее x 2; с 121-го часа года — x 2; либо доп. время отдыха не менее отработанного"
    article: "ст. 152 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026 (часть 1 ст. 152 изм. ФЗ от 25.05.2026 N 144-ФЗ)"
    source_point: "ч. 1 ст. 152"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_152.html: новая редакция вводит лимит 120 ч в год для множителя 1,5 (с 121-го часа — не менее двойного за каждый час). Размер оплаты при замене отдыхом (одинарный) — в новой редакции текста нет, сверить."
    params:
      first_hours: "2"
      first_multiplier: "1.5"
      next_multiplier: "2"
      annual_limit_hours: "120"
      max_hours_per_day: 24
  R5:
    title: Работа в выходной или праздничный день
    formula: "двойная оплата: 2 x ставка x часы; либо одинарная оплата + день отдыха (отдых не оплачивается). Для окладников в пределах нормы — не менее одинарной ставки сверх оклада"
    article: "ст. 153 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ч. 1, 3, 4 ст. 153"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_153.html."
    params:
      double_multiplier: "2"
      single_multiplier: "1"
      max_hours_per_day: 24
  R6:
    title: Пособие по временной нетрудоспособности
    formula: "средний дневной = (заработок за 2 года с учётом предельной базы каждого года) / (730 - исключаемые дни); пособие в день = средний дневной x % по стажу; первые 3 дня оплачивает работодатель, остальные — СФР"
    article: "ст. 3, 7, 14 Федерального закона от 29.12.2006 N 255-ФЗ"
    edition: "255-ФЗ в ред. КонсультантПлюс от 20.02.2026"
    source_point: "ч. 1 ст. 7 (60/80/100 %); ч. 3.1 ст. 14 (730, предельная величина); п. 1 ч. 2 ст. 3 (3 дня за счёт работодателя)"
    checked_on: "2026-11-18"
    verified: false
    verified_note: "СВЕРИТЬ С ОФИЦИАЛЬНЫМ ТЕКСТОМ 255-ФЗ: 255-ФЗ в репозитории нет. Значения взяты со страниц consultant.ru (cons_doc_LAW_64871, ст. 14; подборка «Предельная величина для расчета больничного») и pravo.gov.ru не проверены."
    params:
      divisor: 730
      employer_days: 3
      pct_stazh_lt_5: "0.60"
      pct_stazh_5_to_8: "0.80"
      pct_stazh_ge_8: "1.00"
      stazh_step_1_years: 5
      stazh_step_2_years: 8
      min_months_billing: 24
    base_limits:   # предельная величина базы для взносов за календарный год, руб. (сверить)
      2021: "966000"
      2022: "1032000"
      2023: "1917000"
      2024: "2225000"
      2025: "2759000"
    mrot:          # МРОТ на 1 января года начала болезни, руб. (сверить)
      2024: "19242"
      2025: "22440"
      2026: "27093"
  R7:
    title: Последний рабочий день при увольнении по собственному желанию
    formula: "последний день = дата заявления + 14 календарных дней (срок идёт со следующего дня)"
    article: "ст. 80 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ч. 1 ст. 80"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_80.html. Перенос срока с нерабочего дня на следующий рабочий (ст. 14 ТК) показан как подсказка, не как результат."
    params:
      notice_days: 14
  R8:
    title: Срок выплаты отпускных и окончательного расчёта
    formula: "отпускные — не позднее чем за 3 дня до начала отпуска; окончательный расчёт — в последний рабочий день; зарплата — не позднее 15 дней после периода, при выходном — накануне"
    article: "ст. 136, 140 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026"
    source_point: "ст. 136 (отпускные за 3 дня; зарплата 15 дней); ч. 1 ст. 140"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_136.html, st_140.html."
    params:
      vacation_before_days: 3
      salary_after_days: 15
  R9:
    title: Окончание испытательного срока
    formula: "конец = начало + срок (мес.) - 1 день + дни отсутствия; срок <= 3 мес., для руководителей организации, их заместителей и главных бухгалтеров — <= 6 мес.; договор на 2-6 мес. — <= 2 недель; на срок до 2 мес. испытание не устанавливается"
    article: "ст. 70 ТК РФ"
    edition: "ТК РФ в ред. от 25.05.2026 (абз. изм. ФЗ от 09.04.2026 N 91-ФЗ)"
    source_point: "ч. 4, 5, 6 ст. 70"
    checked_on: "2026-11-18"
    verified: true
    verified_note: "Сверено с st_70.html."
    params:
      max_months: 3
      max_months_senior: 6
      short_contract_weeks: 2
